*{box-sizing:border-box;}
body{

/* HERO */
.hero{
display:flex;
align-items:center;
justify-content:space-between;
gap:3rem;
padding:6rem 1rem;
max-width:1200px;
margin:auto;
flex-wrap:wrap;
}

.hero-text{

max-width:600px;
}

.hero-image{
flex:1 1 420px;
display:flex;
justify-content:center;
}

.hero-image img{
width:100%;
max-width:420px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.15);
}


.hero-tags{
margin-top:1.5rem;
display:flex;
flex-wrap:wrap;
gap:.5rem;
}

.hero-tags span{
background:#eee;
padding:.4rem .8rem;
border-radius:20px;
font-size:.85rem;
}
.hero-tags span:hover{background:#be185d;color:#fff;}


.hero-tags-carousel{
  overflow:hidden;
  margin-top:1.5rem;
  width:100%;
}

.hero-tags-track{
  display:flex;
  gap:.8rem;
  width:max-content;
  animation:scrollTags 20s linear infinite;
}

.hero-tags-track span{
  background:#eee;
  padding:.4rem .9rem;
  border-radius:20px;
  font-size:.85rem;
  white-space:nowrap;
}

@keyframes scrollTags{
  0%{
    transform:translateX(0);
  }
  100%{
    transform:translateX(-50%);
  }
}

/* ===== NAVBAR ===== */

header{
padding:1rem;
background:transparent;
}

.gradient-text{
background:linear-gradient(90deg,#ec4899 0%,#be185d 50%,#000 100%);

}

.modern-navbar{
max-width:1200px;
margin:0 auto;

border-radius:16px;

display:flex;
align-items:center;
justify-content:space-between;

.nav-brand{

align-items:center;

color:white;
font-weight:700;
font-size:1.25rem;
text-decoration:none;

.nav-menu{

gap:.5rem;

text-decoration:none;
border-radius:12px;
font-weight:500;
font-size:.95rem;
padding:.75rem 1rem;
transition:all .3s;

.nav-item:hover{
background:rgba(255,255,255,0.15);
color:white;
}

  justify-content:center;

.card-image:hover .card-overlay{
